  # ----------------- MOMENTUM (28) -----------------

  roc_momentum:                    # 10
    factory: roc_momentum
    prefix: roc
    id_keys: [period]
    grid:
      period: [5, 10, 14, 20, 30, 40, 50, 60, 90, 120]

  dual_momentum:                   # 8
    factory: dual_momentum
    prefix: dualmom
    id_keys: [fast, slow]
    params:
      - {fast: 20,  slow: 60}
      - {fast: 20,  slow: 120}
      - {fast: 30,  slow: 90}
      - {fast: 10,  slow: 60}
      - {fast: 60,  slow: 120}
      - {fast: 30,  slow: 120}
      - {fast: 20,  slow: 250}
      - {fast: 60,  slow: 250}

  rsi_momentum:                    # 10
    factory: rsi_momentum
    prefix: rsimom
    id_keys: [period, lower, upper]
    params:
      - {period: 14, lower: 45, upper: 55}
