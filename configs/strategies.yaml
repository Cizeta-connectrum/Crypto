# FXLab strategy library — declarative expansion to EXACTLY 300 strategies.
#
# Per-family counts (tally — MUST sum to 300):
#   TREND (92):
#     sma_cross 10, ema_cross 10, hull_ma_trend 10, kama_trend 8,
#     macd_signal 10, ma_ribbon 8, supertrend 10, psar_trend 8,
#     ichimoku 8, adx_trend 10
#   BREAKOUT/CHANNEL (50):
#     donchian_breakout 12, bollinger_breakout 10, keltner_breakout 8,
#     atr_volatility_breakout 10, rolling_high_low 10
#   MEAN REVERSION (62):
#     rsi_meanrev 12, bollinger_fade 10, zscore_reversion 10, williams_r 8,
#     cci_reversion 8, stochastic_reversion 8, double_seven 6
#   MOMENTUM (28):
#     roc_momentum 10, dual_momentum 8, rsi_momentum 10
#   OSCILLATOR (24):
#     trix_signal 8, aroon_cross 8, cmo_momentum 8
#   PATTERN (20):
#     engulfing_pattern 6, heikin_ashi_trend 8, inside_bar_breakout 6
#   SEASONAL (12):
#     day_of_week 6, turn_of_month 6
#   COMBO (12):
#     trend_pullback 6, bollinger_trend_filter 3, macd_adx_combo 3
#
#   92 + 50 + 62 + 28 + 24 + 20 + 12 + 12 = 300
#
# Grid forms per family:
#   params: explicit list of param dicts (used verbatim, in order)
#   grid:   cartesian product over declared name->[values] (declaration order)
#   defaults: merged under every produced combination
#   id_keys: which param keys appear in the id (in order); default = all keys

families:

  # ---------------- TREND (92) ----------------

  sma_cross:                       # 10
    factory: sma_cross
    prefix: sma_cross
    id_keys: [fast, slow]
    params:
      - {fast: 5,  slow: 20}
      - {fast: 5,  slow: 50}
      - {fast: 10, slow: 30}
      - {fast: 10, slow: 50}
      - {fast: 10, slow: 100}
      - {fast: 20, slow: 50}
      - {fast: 20, slow: 100}
      - {fast: 20, slow: 200}
      - {fast: 50, slow: 100}
      - {fast: 50, slow: 200}

  ema_cross:                       # 10
    factory: ema_cross
    prefix: ema_cross
    id_keys: [fast, slow]
    params:
      - {fast: 5,  slow: 20}
      - {fast: 8,  slow: 21}
      - {fast: 9,  slow: 26}
      - {fast: 10, slow: 30}
      - {fast: 12, slow: 26}
      - {fast: 12, slow: 50}
      - {fast: 20, slow: 50}
      - {fast: 20, slow: 100}
      - {fast: 50, slow: 100}
      - {fast: 50, slow: 200}

  hull_ma_trend:                   # 10
    factory: hull_ma_trend
    prefix: hull
    id_keys: [period]
    grid:
      period: [9, 16, 20, 25, 36, 49, 55, 64, 81, 100]

  kama_trend:                      # 8
    factory: kama_trend
    prefix: kama
    id_keys: [period]
    grid:
      period: [10, 14, 16, 20, 24, 30, 40, 50]

  macd_signal:                     # 10
    factory: macd_signal
    prefix: macd
    id_keys: [fast, slow, signal]
    params:
      - {fast: 12, slow: 26, signal: 9}
      - {fast: 8,  slow: 21, signal: 5}
      - {fast: 8,  slow: 24, signal: 9}
      - {fast: 5,  slow: 35, signal: 5}
      - {fast: 10, slow: 30, signal: 9}
      - {fast: 12, slow: 26, signal: 5}
      - {fast: 15, slow: 30, signal: 9}
      - {fast: 19, slow: 39, signal: 9}
      - {fast: 6,  slow: 19, signal: 9}
      - {fast: 24, slow: 52, signal: 18}

  ma_ribbon:                       # 8
    factory: ma_ribbon
    prefix: ribbon
    id_keys: [base, step, count]
    params:
      - {base: 10, step: 10, count: 5}
      - {base: 10, step: 20, count: 5}
      - {base: 5,  step: 5,  count: 6}
      - {base: 8,  step: 8,  count: 6}
      - {base: 10, step: 10, count: 6}
      - {base: 20, step: 20, count: 5}
      - {base: 5,  step: 10, count: 8}
      - {base: 10, step: 15, count: 8}

  supertrend:                      # 10
    factory: supertrend
    prefix: supertrend
    id_keys: [period, mult]
    params:
      - {period: 7,  mult: 2.0}
      - {period: 7,  mult: 3.0}
      - {period: 10, mult: 1.5}
      - {period: 10, mult: 2.0}
      - {period: 10, mult: 3.0}
      - {period: 10, mult: 4.0}
      - {period: 14, mult: 2.0}
      - {period: 14, mult: 3.0}
      - {period: 20, mult: 3.0}
      - {period: 20, mult: 4.0}

  psar_trend:                      # 8
    factory: psar_trend
    prefix: psar
    id_keys: [step, max]
    params:
      - {step: 0.01, max: 0.1}
      - {step: 0.01, max: 0.2}
      - {step: 0.02, max: 0.1}
      - {step: 0.02, max: 0.2}
      - {step: 0.02, max: 0.3}
      - {step: 0.03, max: 0.2}
      - {step: 0.03, max: 0.3}
      - {step: 0.04, max: 0.4}

  ichimoku:                        # 8
    factory: ichimoku
    prefix: ichimoku
    id_keys: [mode, conv, base, span_b]
    params:
      - {mode: tk,   conv: 9,  base: 26, span_b: 52}
      - {mode: tk,   conv: 7,  base: 22, span_b: 44}
      - {mode: tk,   conv: 10, base: 30, span_b: 60}
      - {mode: tk,   conv: 12, base: 24, span_b: 48}
      - {mode: kumo, conv: 9,  base: 26, span_b: 52}
      - {mode: kumo, conv: 7,  base: 22, span_b: 44}
      - {mode: kumo, conv: 10, base: 30, span_b: 60}
      - {mode: kumo, conv: 12, base: 24, span_b: 48}

  adx_trend:                       # 10
    factory: adx_trend
    prefix: adx
    id_keys: [period, threshold]
    params:
      - {period: 14, threshold: 20}
      - {period: 14, threshold: 25}
      - {period: 14, threshold: 30}
      - {period: 10, threshold: 20}
      - {period: 10, threshold: 25}
      - {period: 20, threshold: 20}
      - {period: 20, threshold: 25}
      - {period: 7,  threshold: 25}
      - {period: 28, threshold: 20}
      - {period: 28, threshold: 25}

  # ------------- BREAKOUT/CHANNEL (50) -------------

  donchian_breakout:               # 12
    factory: donchian_breakout
