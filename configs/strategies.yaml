    params:
      - {period: 20, num_std: 2.0}
      - {period: 20, num_std: 2.5}
      - {period: 20, num_std: 1.5}
      - {period: 10, num_std: 2.0}
      - {period: 10, num_std: 1.5}
      - {period: 30, num_std: 2.0}
      - {period: 30, num_std: 2.5}
      - {period: 50, num_std: 2.0}
      - {period: 14, num_std: 2.0}
