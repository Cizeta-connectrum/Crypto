      - {entry: 40, exit: 0}
      - {entry: 55, exit: 0}
      - {entry: 20, exit: 10}
      - {entry: 40, exit: 20}
      - {entry: 55, exit: 20}
      - {entry: 100, exit: 0}
      - {entry: 5,  exit: 0}
      - {entry: 30, exit: 15}
      - {entry: 50, exit: 25}
      - {entry: 25, exit: 0}

  bollinger_breakout:              # 10
