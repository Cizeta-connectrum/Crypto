      - {period: 3,  lower: 15, upper: 85}
      - {period: 5,  lower: 20, upper: 80}
      - {period: 7,  lower: 25, upper: 75}
      - {period: 14, lower: 30, upper: 70}
      - {period: 14, lower: 25, upper: 75}
      - {period: 14, lower: 20, upper: 80}
      - {period: 10, lower: 30, upper: 70}
      - {period: 4,  lower: 20, upper: 80}
      - {period: 21, lower: 30, upper: 70}
      - {period: 9,  lower: 25, upper: 75}

  bollinger_fade:                  # 10
    factory: bollinger_fade
